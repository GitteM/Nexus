# DeepSeek AI code review for pull requests.
#
# Uses a vendored copy of hustcer/deepseek-review (MIT) with a Nexus patch
# that fixes a nushell↔awk pipe deadlock on large diffs:
#   .github/actions/deepseek-review/  (see VENDORED.md for provenance + patch)
#
# Setup (one-time):
#   1. Add your DeepSeek API key as a repository secret named
#      `DEEPSEEK_API_KEY` (Settings → Secrets and variables → Actions →
#      New repository secret). The key is only used by this workflow.
#
# On-demand review:
#   - Reviews run only when the `ai review` label is added to a PR. Add the
#     label to request a review; remove it if you want it re-run after
#     changes (re-adding the label triggers another run).
#   - Cost control: no automatic review per push; large PRs are supported by
#     the vendored patch (upstream deadlocks on diffs > ~64 KB).
#   - Opt out of a specific review by removing the label.
#
# Model: defaults to `deepseek-v4-flash` on https://api.deepseek.com.
# Override via the `model` / `base-url` inputs if the key's plan exposes
# different models.

name: DeepSeek PR Review

on:
  pull_request:
    types:
      - labeled # A label was added to the PR (the `ai review` trigger)

permissions:
  pull-requests: write # Post the review on the PR
  contents: read

jobs:
  deepseek-review:
    # Same-repo PRs only. We deliberately use `pull_request`, not
    # `pull_request_target`: this workflow has access to the
    # DEEPSEEK_API_KEY secret, and `pull_request` keeps that secret out of
    # fork-PR contexts. Switch to `pull_request_target` only if fork PRs
    # must be reviewed too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ai review')
    # A healthy review finishes in well under a minute (observed ~18 s).
    # Cap at 8 minutes so a stalled run fails fast and visibly instead of
    # zombie-ing for 30 minutes; re-run the job to retry after a blip.
    timeout-minutes: 8
    # One review at a time per PR: a newer run cancels the stale one.
    concurrency:
      group: deepseek-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    name: DeepSeek Code Review
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      # A local action runs from the checked-out workspace. For
      # `pull_request` events the default checkout is the merge commit
      # (base + head), which contains .github/actions/deepseek-review once
      # this vendored action is on main.
      - name: Check out merge ref
        uses: actions/checkout@v4

      - name: Run DeepSeek code review
        # Skip (rather than fail) until the secret exists.
        if: env.DEEPSEEK_API_KEY != ''
        # Vendored + patched (see VENDORED.md). Re-point at the upstream pin
        # when upstream ships the pipe-deadlock fix.
        uses: ./.github/actions/deepseek-review
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}
