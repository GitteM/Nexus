name: UI Tests

on:
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI Tests (Xcode 26.6, iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-ui-${{ runner.os }}-${{ hashFiles('Nexus.xcodeproj/project.pbxproj', 'Nexus.xcodeproj/xcshareddata/xcschemes/Nexus.xcscheme', 'Nexus.xcworkspace/contents.xcworkspacedata', 'TestPlan.xctestplan', 'Configs/*.xcconfig', 'AppPackages/**/Package.swift') }}
          restore-keys: |
            deriveddata-ui-${{ runner.os }}-

      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -workspace Nexus.xcworkspace
          -scheme Nexus
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData

      - name: Find available iPhone simulator
        id: simulator
        run: |
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["name"] for runtime in d["devices"].values() for x in runtime if x["isAvailable"] and x["name"].startswith("iPhone")))')"
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iPhone simulator on this runner"
            exit 1
          fi
          echo "Simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # Cold-simulator first-launch gestures are flaky on free-tier runners
      # (see ci.yml). Prewarm: boot fully, then launch/terminate the app once
      # before the real runs, and retry failed tests once in-place.
      - name: Prewarm simulator
        run: |
          DEVICE="${{ steps.simulator.outputs.device }}"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "DerivedData/Build/Products/Debug-iphonesimulator/Nexus.app"
          xcrun simctl launch "$DEVICE" com.nexusbank.app
          sleep 8
          xcrun simctl terminate "$DEVICE" com.nexusbank.app || true

      - name: Test (full workspace TestPlan incl. UI)
        run: >
          xcodebuild test-without-building
          -workspace Nexus.xcworkspace
          -scheme Nexus
          -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}'
          -derivedDataPath DerivedData
          -retry-tests-on-failure
          -test-iterations 2
