name: PR Checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: SwiftFormat lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install swiftformat 0.63.0
        run: |
          curl -sL https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip -o /tmp/swiftformat.zip
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          sudo cp /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          swiftformat --version

      - name: Lint
        run: swiftformat --lint .

  packages:
    name: Package builds (Swift 6.3)
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$DEVELOPER_DIR"

      - name: Build NexusDomain
        run: swift build --package-path AppPackages/NexusDomain

      - name: Build NexusData
        run: swift build --package-path AppPackages/NexusData

      - name: Build NexusFeatures
        run: swift build --package-path AppPackages/NexusFeatures
