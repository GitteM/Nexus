name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Xcode 26.6, iPhone 17)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Nexus.xcodeproj/project.pbxproj', 'Nexus.xcodeproj/xcshareddata/xcschemes/Nexus.xcscheme', 'Nexus.xcworkspace/contents.xcworkspacedata', 'TestPlan.xctestplan', 'Configs/*.xcconfig', 'AppPackages/**/Package.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -workspace Nexus.xcworkspace
          -scheme Nexus
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -derivedDataPath DerivedData

      - name: Test (workspace TestPlan)
        run: >
          xcodebuild test-without-building
          -workspace Nexus.xcworkspace
          -scheme Nexus
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -derivedDataPath DerivedData
