name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Xcode 26.6, iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Nexus.xcodeproj/project.pbxproj', 'Nexus.xcodeproj/xcshareddata/xcschemes/Nexus.xcscheme', 'Nexus.xcworkspace/contents.xcworkspacedata', 'TestPlan.xctestplan', 'Configs/*.xcconfig', 'AppPackages/**/Package.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      # Compiling never needs a concrete device, so build against the
      # generic simulator destination. A named device ("iPhone 17") would
      # fail here whenever the runner image's device set differs.
      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -workspace Nexus.xcworkspace
          -scheme Nexus
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData

      # test-without-building cannot target the generic destination: it must
      # launch on a bootable simulator. Pick the first available iPhone on
      # the runner so the test step survives device-name drift too.
      - name: Find available iPhone simulator
        id: simulator
        run: |
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["name"] for runtime in d["devices"].values() for x in runtime if x["isAvailable"] and x["name"].startswith("iPhone")))')"
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iPhone simulator on this runner"
            exit 1
          fi
          echo "Simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # The full workspace TestPlan runs here, UI suite included. (The UI
      # suite was temporarily excluded while a cold-runner stuck-loading
      # bug was chased; root-caused and fixed in PR #26 — destination
      # models are now minted once per route. If free-tier cold-runner
      # flakes return, reproduce locally on a warm simulator before
      # treating them as regressions — AGENTS.md §5.6.)
      - name: Test (workspace TestPlan)
        run: >
          xcodebuild test-without-building
          -workspace Nexus.xcworkspace
          -scheme Nexus
          -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}'
          -derivedDataPath DerivedData
          -retry-tests-on-failure
          -test-iterations 2
